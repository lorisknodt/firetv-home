# Builds the launcher APK on every change to it. The APK is attached to the run as an artifact, and
# to a GitHub release when a v* tag is pushed (git tag v1.1 && git push --tags).
#
# Signing: an APK can only update an installed copy signed with the same key. Put your key in the
# KEYSTORE_BASE64 secret (base64 of launcher/debug.keystore) to get APKs that install over yours;
# without it, the run makes a throwaway key.
name: Build

on:
  push:
    # With a tags filter, branch pushes only trigger when branches are listed too.
    branches: ["main"]
    paths: ["launcher/**", ".github/workflows/build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-30" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > launcher/debug.keystore

      - name: Build
        run: launcher/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firehome-apk
          path: launcher/build/firehome.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" launcher/build/firehome.apk --generate-notes
